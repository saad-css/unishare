services:
  - type: web
    name: unishare-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn wsgi:application
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: unishare-postgres
          property: connectionString

databases:
  - name: unishare-postgres
    databaseName: unishare_db
    user: unishare_user
